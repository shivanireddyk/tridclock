[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tridclock"
version = "0.1.0"
description = "TRID disclosure timing and fee tolerance for mortgage lending, with the reasoning attached to every result."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shivani Krishnama", email = "shivanireddyk08@gmail.com" }]
keywords = ["mortgage", "trid", "regulation-z", "compliance", "business-days"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/shivanireddyk/tridclock"
Source = "https://github.com/shivanireddyk/tridclock"

[tool.hatch.build.targets.wheel]
packages = ["src/tridclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=tridclock --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
